<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contato</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="cabecalho">
        <div class="logo">TechVanguard
        </div>
        <nav class="menu">
            <a href="index.html" target="_blank">portal</a>
            <a href="login.html"  target="_blank">login</a>
            <a href="precos.html"  target="_blank">Precos</a>
        </nav>
    </header>
    <main class="container">
        <h1 class="titulo-secao">Cadastro para TechVanguard</h1>
        <p class="subtitulo">Preencha seus dados para realizar a inscrição no Nosso site</p>

        <div class="area-inscricao">
            <form action="/processar-cadastro" method="post" class="coluna-form">

                <label for="nome">Nome:</label><br>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required minlength="3" maxlength="50" required><br>

                <label for="senha">Senha de acesso:</label><br>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required minlength="8" maxlength="20" required><br>
                 
                <label for="email">E-mail:</label><br>

                <input type="email" id="email" name="email" placeholder="exemplo@dominio.com" required><br>

                <label for="data_nacs"> Data de nacsimento:</label><br>
                <input type="date" id="data_nacs" name="data_nacsimento" min="1900-01-01" max="2026-12-31"><br>

            
                <label for="unidade">Selecione seu servico</label>
                <select name="unidade" id="unidade" required> <br>

                    <option value="" disa selected> selecione seu servico</option>
                    <option value="Sebas">Sebastionopolis</option>
                    <option value="Votu">Votuporanga</option>
                    <option value="Sp">São Paulo</option>
                    <option value="VG">Valentim Gentil</option> <br><br>


                </select>
                <input type="checkbox" id="termos" name="termos" required>
                <label for="termos">Li e aceito os termos de uso</label><br><br>

                <button type="submit" class="btn-login">login</button>
                <button type="reset" class="btn-limpar">Limpar tudo</button>

                
                

            </form>


            </div>

        </div>

    </main>
    
</body>
</html>
